<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playlist &amp; Schedule Builder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f6f8; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .big-time { font-size: 1.35rem; font-weight: 600; letter-spacing: .5px; }
    .copy { cursor: pointer; border-bottom: 1px dashed #adb5bd; }
    .copy:hover { background: #fff3cd; }
    .copy.copied { background: #d4edda; }
    .cpl { font-size: .78rem; word-break: break-all; }
    .slot-btn { min-width: 74px; }
    .film-row { border-left: 4px solid #007bff; }
    details > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .tag-cue { font-size: .72rem; }
    .table-sm td, .table-sm th { vertical-align: middle; }
    .status-ok { color: #28a745; font-weight: 600; }
    .status-bad { color: #dc3545; font-weight: 600; }
    .status-tight { color: #b8860b; font-weight: 600; }
    .section-title { font-size: 1.05rem; font-weight: 600; }
    .x-btn { cursor: pointer; color: #adb5bd; }
    .x-btn:hover { color: #dc3545; }
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3">
  <span class="navbar-brand mb-0 h1">Playlist &amp; Schedule Builder</span>
  <span class="text-light small" id="dataStatus"></span>
  <button class="btn btn-sm btn-outline-light" id="refreshBtn">&#8635; Refresh sheet</button>
</nav>

<div class="container-fluid" style="max-width:1280px">
  <div id="banner"></div>
  <div id="app"><div class="text-center text-muted py-5">Loading…</div></div>
  <p class="text-muted small mt-4 mb-5" id="footnote"></p>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
